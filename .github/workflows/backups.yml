name: Encrypted recovery backup
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: encrypted-recovery-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'ashmoore769/Moore-Weather' && github.ref == 'refs/heads/main'
    permissions:
      # The short-lived job token creates the unpublished backup release and
      # uploads its encrypted assets; no static storage secret is required.
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      kind: ${{ steps.upload.outputs.kind }}
      sha256: ${{ steps.ack.outputs.sha256 }}
      bytes: ${{ steps.ack.outputs.bytes }}
      created_at: ${{ steps.ack.outputs.created_at }}
      artifact_id: ${{ steps.ack.outputs.artifact_id }}
      storage_provider: ${{ steps.ack.outputs.storage_provider }}
      release_id: ${{ steps.upload.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download and checksum encrypted recovery copy
        id: download
        run: node tools/offsite-backup-client.js download
      - name: Store and verify ciphertext in the unpublished backup release
        id: upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-backup-storage.js upload
      - name: Acknowledge the verified offsite release asset
        id: ack
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.upload.outputs.asset_id }}
          BACKUP_RELEASE_ID: ${{ steps.upload.outputs.release_id }}
          BACKUP_STORAGE_PROVIDER: github-release
        run: node tools/offsite-backup-client.js ack

  receipt:
    needs: backup
    if: github.repository == 'ashmoore769/Moore-Weather' && github.ref == 'refs/heads/main' && needs.backup.result == 'success'
    permissions:
      contents: write
      id-token: none
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Record the completed backup receipt
        id: receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_JOB_RESULT: ${{ needs.backup.result }}
          BACKUP_SHA256: ${{ needs.backup.outputs.sha256 }}
          BACKUP_BYTES: ${{ needs.backup.outputs.bytes }}
          BACKUP_CREATED_AT: ${{ needs.backup.outputs.created_at }}
          BACKUP_ARTIFACT_ID: ${{ needs.backup.outputs.artifact_id }}
          BACKUP_RELEASE_ID: ${{ needs.backup.outputs.release_id }}
          BACKUP_STORAGE_PROVIDER: ${{ needs.backup.outputs.storage_provider }}
        run: node tools/record-backup-receipt.js
      - name: Keep the checkpoint and three verified daily release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_JOB_RESULT: ${{ needs.backup.result }}
          BACKUP_RECEIPT_RESULT: ${{ steps.receipt.outcome }}
          BACKUP_KIND: ${{ needs.backup.outputs.kind }}
          BACKUP_SHA256: ${{ needs.backup.outputs.sha256 }}
          BACKUP_BYTES: ${{ needs.backup.outputs.bytes }}
          BACKUP_CREATED_AT: ${{ needs.backup.outputs.created_at }}
          BACKUP_ARTIFACT_ID: ${{ needs.backup.outputs.artifact_id }}
          BACKUP_ASSET_ID: ${{ needs.backup.outputs.artifact_id }}
          BACKUP_RELEASE_ID: ${{ needs.backup.outputs.release_id }}
          BACKUP_STORAGE_PROVIDER: github-release
        run: node tools/release-backup-storage.js rotate
