name: Live health monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-health-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'ashmoore769/Moore-Weather'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node tools/monitor-live.js
