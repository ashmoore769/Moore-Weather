name: Offline checks
on:
  push:
    branches: [main, 'update/water-cards-rainfall-*']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install browser test tools
        if: ${{ hashFiles('tools/check-dashboard.cjs') != '' }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Check responsive water cards and rainfall comparison
        if: ${{ hashFiles('tools/check-dashboard.cjs') != '' }}
        run: node tools/check-dashboard.cjs
