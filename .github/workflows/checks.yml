name: Offline checks
on:
  push:
    branches: [main, 'update/water-cards-rainfall-*', 'update/analytics-*', 'update/dashboard-*', 'update/reliability-*', 'feature/fronius-solar-*']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Set up collector test runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the Fronius collector offline
        run: python3 -m unittest discover -s integrations/fronius -p 'test_*.py' -v
      - name: Check Pi network recovery safeguards offline
        run: |
          python3 -m unittest discover -s integrations/pi -p 'test_*.py' -v
          bash -n integrations/pi/install.sh
      - name: Verify current Connolly council source
        if: startsWith(github.ref, 'refs/heads/update/dashboard-')
        run: node tools/verify-connolly.cjs
      - name: Install matching browser test package
        timeout-minutes: 4
        if: ${{ hashFiles('tools/check-dashboard.cjs') != '' }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check protected station terminal
        run: node tools/check-terminal.cjs
      - name: Check radar activation and viewer controls
        run: node tools/check-radar.cjs
      - name: Check responsive water cards and rainfall comparison
        if: ${{ hashFiles('tools/check-dashboard.cjs') != '' }}
        run: node tools/check-dashboard.cjs

      - name: Check the private solar card and connection states
        run: node tools/check-solar.cjs

      - name: Check the forecast summary and hourly rain controls
        run: node tools/check-forecast-summary.cjs

      - name: Check analytics and privacy controls
        run: node tools/check-analytics.cjs

      - name: Save dashboard review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-review
          path: artifacts/dashboard/
          if-no-files-found: warn
          retention-days: 7
