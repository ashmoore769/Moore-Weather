name: Offline checks
on:
  push:
    branches: [main, 'update/water-cards-rainfall-*', 'update/analytics-*']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install matching browser test package
        timeout-minutes: 4
        if: ${{ hashFiles('tools/check-dashboard.cjs') != '' }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check responsive water cards and rainfall comparison
        if: ${{ hashFiles('tools/check-dashboard.cjs') != '' }}
        run: node tools/check-dashboard.cjs

      - name: Check analytics and privacy controls
        run: node tools/check-analytics.cjs
